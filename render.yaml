services:

type: web
name: ocr-app-backend
env: python
repo: https://github.com/starduztx/OCRtest
branch: main
buildCommand: "./build.sh"
startCommand: "gunicorn backend.app:app"
autoDeploy: true
buildpacks:

name: apt
config:
packages:
- tesseract-ocr
- tesseract-ocr-tha
- libglib2.0-0
- libgl1
envVars:

key: PYTHONUNBUFFERED
value: "1"
staticFiles:

path: frontend
urlPrefix: /